name = "viaje-ceara-ask"
main = "index.js"
compatibility_date = "2026-09-01"
workers_dev = true
preview_urls = false
# Não apagar variáveis criadas no painel do Cloudflare a cada deploy pelo GitHub
keep_vars = true

[vars]
GEMINI_MODEL = "gemini-3.1-flash-lite"
ALLOWED_ORIGIN = "https://pdroarraes-creator.github.io"

# Memória das perguntas (Workers KV, namespace viaje-ceara-qa)
[[kv_namespaces]]
binding = "QA"
id = "d89cf90a5bf0437c83a3ba2a2a3acaff"

# Segredos ficam só no painel do Cloudflare (Settings → Variables and Secrets):
#   GEMINI_API_KEY, SITE_PASSWORD, ADMIN_KEY

# Cada 15 minutos mira si el sitio cambió de versión y manda el aviso push
[triggers]
crons = ["*/15 * * * *"]
